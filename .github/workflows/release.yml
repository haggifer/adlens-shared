# Publishes to npm when a version tag (v1.2.3) is pushed. Authenticates with npm trusted publishing (OIDC),
# so no NPM_TOKEN secret exists and provenance is attached automatically.
name: Release

on:
    push:
        tags: ['v*']

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org
                  cache: npm
            - run: npm ci
            - name: Tag matches the package version
              run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
            - run: npm publish
